[project]
name = "pbit-qec"
version = "0.1.0"
description = "Research prototype for p-bit probabilistic-Ising coset decoding in quantum error correction."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "p-bit QEC study contributors" }
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pymatching>=2.4.0",
  "pytest>=7.4",
  "ruff>=0.5",
]
matching = [
  "pymatching>=2.4.0",
]

[project.scripts]
pbit-qec-run = "pbit_qec.experiments:main"
pbit-qec-hard-cases = "pbit_qec.hard_cases:main"
pbit-qec-plots = "pbit_qec.plotting:main"
pbit-qec-tune-pbit-nullspace = "pbit_qec.calibration:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
